<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#171714" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#171714" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f7f6f2"/>
  <circle cx="1110" cy="55" r="210" fill="#e3f1ed" opacity="0.8"/>
  <circle cx="65" cy="635" r="210" fill="#eee7ff" opacity="0.72"/>

  <!-- Brand -->
  <g transform="translate(64 56)" fill="#20201e">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="none" stroke="#20201e" stroke-width="2"/>
    <path d="M10 21h15m-8 0v-8m0 8v11m0-19a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" fill="none" stroke="#20201e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="32" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">tooltrim</text>
  </g>

  <!-- Copy -->
  <g transform="translate(64 180)">
    <rect x="0" y="0" width="116" height="34" rx="17" fill="#20201e"/>
    <text x="58" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ffffff">MA STACK</text>
    <text x="0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-3.6" fill="#20201e">Votre stack,</text>
    <text x="0" y="180" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-3.6" fill="#20201e">enfin claire.</text>
    <text x="0" y="235" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#686863">Vos outils rangés par besoin,</text>
    <text x="0" y="269" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#686863">sans perdre la vue d’ensemble.</text>
  </g>

  <text x="64" y="574" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#20201e">tooltrim.com</text>

  <!-- Board stack -->
  <g transform="translate(682 68)">
    <g transform="translate(54 16) rotate(5 190 235)" filter="url(#softShadow)">
      <rect x="0" y="0" width="390" height="470" rx="24" fill="#d9efe7" stroke="#c8ded6" stroke-width="2"/>
      <rect x="22" y="22" width="346" height="324" rx="18" fill="#cde7dd"/>
    </g>
    <g transform="translate(10 35) rotate(-5 190 235)" filter="url(#softShadow)">
      <rect x="0" y="0" width="390" height="470" rx="24" fill="#eee7ff" stroke="#ddd4f4" stroke-width="2"/>
      <rect x="22" y="22" width="346" height="324" rx="18" fill="#e3d9fb"/>
    </g>

    <g transform="translate(40 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="410" height="490" rx="25" fill="#ffffff" stroke="#d9d8d2" stroke-width="2"/>
      <rect x="20" y="20" width="370" height="350" rx="19" fill="#dceefa"/>

      <text x="48" y="102" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" letter-spacing="-2.2" fill="#20201e">Design</text>
      <text x="48" y="137" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4f514f">7 OUTILS</text>
      <text x="48" y="185" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#363735">Création, interface, image</text>
      <text x="48" y="212" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#363735">et ressources visuelles.</text>

      <!-- Logo pile -->
      <g transform="translate(50 266)">
        <circle cx="44" cy="44" r="43" fill="#ffffff" stroke="#cbd5d8" stroke-width="2"/>
        <circle cx="44" cy="44" r="30" fill="#e61926"/>
        <circle cx="44" cy="44" r="13" fill="#ffffff"/>

        <circle cx="123" cy="44" r="43" fill="#ffffff" stroke="#cbd5d8" stroke-width="2"/>
        <circle cx="123" cy="44" r="30" fill="#182c56"/>
        <text x="123" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#ffffff">G</text>

        <circle cx="202" cy="44" r="43" fill="#ffffff" stroke="#cbd5d8" stroke-width="2"/>
        <circle cx="202" cy="44" r="30" fill="#f27a00"/>
        <circle cx="202" cy="44" r="10" fill="#ffffff"/>

        <circle cx="281" cy="44" r="43" fill="#40413f" stroke="#6c6d69" stroke-width="2"/>
        <text x="281" y="53" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff">+4</text>
      </g>

      <text x="34" y="432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#20201e">Explorer</text>
      <circle cx="150" cy="426" r="27" fill="#f7f6f2"/>
      <path d="M139 426h20m-7-7 7 7-7 7" fill="none" stroke="#20201e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="264" y="399" width="112" height="54" rx="27" fill="#ffffff" stroke="#d5d4cf" stroke-width="2"/>
      <text x="320" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#20201e">+ Ajouter</text>
    </g>
  </g>
</svg>
