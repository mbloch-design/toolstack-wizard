<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Dark mode is disabled site-wide (see useTheme.ts) — the "light"
         class above is the permanent default. This script just clears any
         stale "dark" value a returning visitor's browser may still have in
         localStorage from before dark mode was turned off, so it can't
         resurface. -->
    <script>
      (function () {
        try { localStorage.removeItem("theme"); } catch (e) {}
      })();
    </script>

    <title>ToolTrim | Decide which software to keep, replace, or add</title>
    <meta
      name="description"
      content="Decide which software to keep, replace, or add based on your stack, budget, and real workflow. Independent analysis and verified pricing."
    />
    <meta name="author" content="ToolTrim" />
    <meta name="robots" content="index, follow" />

    <!-- AI crawler signals (GEO) -->
    <meta name="ai-content-type" content="pricing, tool-analysis, saas-comparison, freelance-tools" />
    <meta name="data-verified" content="true" />
    <meta name="data-verified-date" content="2026-04-30" />
    <meta name="data-freshness" content="2026-04-30" />
    <meta name="ai-summary" content="ToolTrim is an independent SaaS stack auditor covering 1,100+ tools with human-verified pricing. It helps freelancers and founders detect redundant subscriptions, compare alternatives, and reduce software costs, with no affiliate bias." />

    <!-- Static OG defaults (per-route og:url/og:locale/type injected by react-helmet-async via DynamicCanonical) -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://tooltrim.com/og-image-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="ToolTrim software stack decision platform" />
    <meta property="og:site_name" content="ToolTrim" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tooltrim" />
    <meta name="twitter:image" content="https://tooltrim.com/og-image-v2.png" />

    <!-- Static JSON-LD: Organization + WebSite (visible to crawlers without JS) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "ToolTrim",
          "url": "https://tooltrim.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://tooltrim.com/og-image-v2.png",
            "width": 1200,
            "height": 630
          },
          "description": "Independent SaaS stack auditor with human-verified pricing for 1,100+ tools.",
          "sameAs": [
            "https://twitter.com/tooltrim",
            "https://www.crunchbase.com/organization/tooltrim",
            "https://www.linkedin.com/company/tooltrim",
            "https://www.producthunt.com/products/tooltrim"
          ]
        },
        {
          "@type": "WebSite",
          "name": "ToolTrim",
          "url": "https://tooltrim.com",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://tooltrim.com/en/tools?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Favicon stack — PNG explicites pour forcer la mise à jour du cache SERP Google -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/picto-logo.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnect for font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://rtfyfuwfdpnsogovkwai.supabase.co" />
    <link rel="preconnect" href="https://www.google.com" />

    <!-- Uncut Sans Variable — self-hosted, preloaded for FCP -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/UncutSans-Variable.woff2" crossorigin />

    <!-- Inter + Inter Tight — Google Fonts, non-render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" /></noscript>

    <script>
      // Defer GTM loading to after first paint
      window.addEventListener('load', function() {
        // Never pollute the production property with localhost, previews or
        // unrelated hostnames. Production is the only measured environment.
        if (window.location.hostname !== 'tooltrim.com' && window.location.hostname !== 'www.tooltrim.com') return;
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-DL5MJKQ3JE';
        s.async = true;
        document.head.appendChild(s);
        s.onload = function() {
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          // React owns every page_view, including the initial one. Disabling
          // the automatic hit avoids double-counting the first route.
          gtag('config', 'G-DL5MJKQ3JE', { send_page_view: false, anonymize_ip: true });
        };
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
