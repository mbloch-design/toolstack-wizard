<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
    <title>ToolTrim — Auditez et optimisez votre stack SaaS</title>
    <meta
      name="description"
      content="Découvrez en 3 minutes quels outils virer, remplacer ou dégrader. Analyse personnalisée. Prix vérifiés. Recommandations actionnables."
    />
    <meta name="author" content="ToolTrim" />
    <meta name="robots" content="index, follow" />

    <!-- AI crawler signals (GEO) -->
    <meta name="ai-content-type" content="pricing, tool-analysis, saas-comparison, freelance-tools" />
    <meta name="data-verified" content="true" />
    <meta name="data-verified-date" content="2026-03-13" />
    <meta name="data-freshness" content="2026-04-02" />
    <meta name="ai-summary" content="ToolTrim is an independent SaaS stack auditor covering 212 tools with human-verified pricing. It helps freelancers and founders detect redundant subscriptions, compare alternatives, and reduce software costs — with no affiliate bias." />

    <!-- Static OG defaults (per-route og:url/og:locale/type injected by react-helmet-async via DynamicCanonical) -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://tooltrim.com/og-image.png" />
    <meta property="og:site_name" content="ToolTrim" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tooltrim" />
    <meta name="twitter:image" content="https://tooltrim.com/og-image.png" />

    <!-- Static JSON-LD: Organization + WebSite (visible to crawlers without JS) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "ToolTrim",
          "url": "https://tooltrim.com",
          "logo": "https://tooltrim.com/og-image.png",
          "description": "Independent SaaS stack auditor with human-verified pricing for 212 tools.",
          "sameAs": ["https://twitter.com/tooltrim", "https://www.crunchbase.com/organization/tooltrim"]
        },
        {
          "@type": "WebSite",
          "name": "ToolTrim",
          "url": "https://tooltrim.com",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://tooltrim.com/fr/tools?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/picto-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/picto-logo.svg" />
    <link rel="apple-touch-icon" href="/picto-logo.svg" />

    <!-- Preconnect for font origin -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking Google Fonts: load as print, swap to all on load -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;400;500;600;700;1,9..40,300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;400;500;600;700;1,9..40,300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;400;500;600;700;1,9..40,300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" /></noscript>

    <script>
      // Defer GTM loading to after first paint
      window.addEventListener('load', function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-DL5MJKQ3JE';
        s.async = true;
        document.head.appendChild(s);
        s.onload = function() {
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-DL5MJKQ3JE');
        };
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
