name: Preprod CI

on:
  pull_request:
    branches:
      - main
      - preprod
  push:
    branches:
      - "codex/**"
      - main
      - preprod

permissions:
  contents: read

concurrency:
  group: preprod-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Application unit tests
        run: npm test

      - name: Prepare local Redis for submission integration tests
        run: |
          if ! command -v redis-server >/dev/null || ! command -v redis-cli >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
          echo "SUBMISSION_TEST_REDIS_BIN=$(dirname "$(command -v redis-server)")" >> "$GITHUB_ENV"

      - name: API handler contract fixtures
        run: npm run test:api

      - name: SEO build contract fixtures
        run: npm run test:seo-contracts

      - name: Design tokens gate
        run: npm run validate:design-tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Ma stack unit and exploration tests
        run: npm run test:ma-stack

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Payment return and draft recovery (simulated provider)
        run: npm run test:e2e:payment

      - name: Generated HTML hydration tests
        run: npm run test:e2e:hydration

      - name: Hydration report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hydration-report
          path: |
            playwright-report/
            test-results/
            payment-report/
            payment-test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Diff hygiene
        run: git diff --check
