name: Preprod CI

on:
  pull_request:
    branches:
      - main
      - preprod
  push:
    branches:
      - "codex/**"
      - preprod

concurrency:
  group: preprod-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Diagnostic gate
        run: npm run validate:diagnostic

      - name: Design tokens gate
        run: npm run validate:design-tokens

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
