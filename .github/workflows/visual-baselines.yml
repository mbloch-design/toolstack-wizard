name: Visual baselines

# Run by hand, only after Michael validated the stories in Storybook. Rewrites the references of the chosen branch.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Validation (ex. « Budget validé par Michael le 08/11 »)"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20

    steps:
      - name: Git for the commit
        run: apt-get update && apt-get install -y git

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install and build Storybook
        run: npm ci && npm run build-storybook

      - name: Capture references
        run: npx playwright test -c visual/playwright.visual.config.ts --update-snapshots
        env:
          CI: "true"

      - name: Commit references
        env:
          NOTE: ${{ inputs.note }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual/__screenshots__
          git commit -m "test(ds): visual baselines, $NOTE" || echo "Rien à changer"
          git push
